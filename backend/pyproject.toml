[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halluciwatch"
version = "0.2.0"
description = "Real-time hallucination risk scoring for local LLMs via generation-time signal fingerprinting"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "HalluciWatch" }]
keywords = ["llm", "hallucination", "ollama", "ai-safety", "uncertainty", "calibration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core install is deliberately tiny: an HTTP client and numpy. Scoring with
# a trained model needs scikit-learn (the [train] extra); nothing here pulls in
# torch or transformers, because the whole point is that the model runs in
# Ollama rather than in this process.
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
]

[project.optional-dependencies]
train = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]
lightgbm = ["lightgbm>=4.0"]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
all = ["halluciwatch[train,server,lightgbm]"]

[project.scripts]
halluciwatch = "halluciwatch.cli:main"

[project.urls]
Repository = "https://github.com/ashusnapx/halluciwatch"
Issues = "https://github.com/ashusnapx/halluciwatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/halluciwatch"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI's Depends()/Field() defaults are idiomatic in signatures
    "RUF001",  # docstrings quote real model output containing unicode punctuation
    "SIM905",  # a wrapped """...""".split() word list reads better than 80 quoted strings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a running Ollama server with models pulled",
]

[tool.coverage.run]
source = ["src/halluciwatch"]
